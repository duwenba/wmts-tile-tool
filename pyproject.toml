[project]
name = "wmts-tile-tool"
version = "0.1.0"
description = "WMTS 瓦片下载与拼接工具（Rust 高速合并引擎）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "h2>=4.1.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "socksio>=1.0.0",
    "wxpython>=4.2.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# wxPython 官方在 PyPI 上没有 Linux wheel，但 Windows/macOS 有官方 wheel。
# 因此按平台分流：Linux 使用官方 extras 仓库的 Ubuntu 24.04 构建
# （glibc 2.39+，可兼容 Arch/CachyOS 等发行版），其余平台回退到 PyPI。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
wxpython = [
  { url = "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_full_version == '3.11.*'" },
  { url = "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_full_version == '3.12.*'" },
  { url = "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_full_version == '3.13.*'" },
  { url = "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp314-cp314-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_full_version >= '3.14'" },
  { index = "pypi", marker = "sys_platform != 'linux'" },
]
